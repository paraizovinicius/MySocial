spring.application.name=mysocial

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update

r2.account-id=${R2_ACCOUNT_ID}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.bucket-name=${R2_BUCKET_NAME}
r2.public-base-url=${R2_PUBLIC_BASE_URL:}

# rejects oversized uploads at the servlet layer, before R2StorageService reads them into memory;
# keep this in sync with MAX_FILE_SIZE_BYTES in R2StorageService
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB